name: main

on:
  push:
    branches:
      - main

# Limit concurrent runs for the `main` branch
concurrency:
  group: main

jobs:
  main:
    runs-on: ubuntu-latest

    steps:
      # The checkout is given no token and persists none, so nothing the gate
      # runs can read a write credential from the repository's git config. The
      # PAT exists for one step, the tag push at the end, after the gate. That
      # a checkout persists its token in git config is assumed from
      # https://github.com/actions/checkout#usage, not observed.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3.1.0
        with:
          just-version: '1.46.0'
      - uses: ./.github/actions/ocaml-deps

      # test/ssh_real_sshd/ssh_real_sshd.sh authenticates against an sshd it
      # stands up itself, because nothing short of a daemon can say whether a
      # passphrase-protected key actually produces a signature a server
      # accepts. It refuses to skip when CI is set, which the runner sets, so
      # the daemon is installed here rather than assumed: what a runner image
      # happens to ship is not a dependency this repository gets to have
      # unwritten.
      #
      # test/alloy_real_docker/alloy_real_docker.sh is the same kind of test
      # for log collection: it runs the Alloy image the server deploys against
      # labelled containers, because which containers the generated config
      # keeps is decided by Alloy's Docker discovery and by nothing this tree
      # can read. It too refuses to skip when CI is set. Docker, jq and curl
      # come with the hosted runner image rather than from a step here, so the
      # loop is what says so when an image stops shipping one of them, and
      # `docker info` is what says the daemon behind the client answers.
      #
      # test/homebrew_formula/update_formula.t runs the release's formula
      # updater under python3, which also comes with the runner image rather
      # than from a step here, so the loop names it for the same reason.
      #
      # The loop is the precondition rather than a formality, and it names
      # every program those scripts need, not only the ones installed
      # above. `setsid` comes from util-linux on the base image, so a runner
      # image that drops it says so here instead of arriving later as a test
      # that cannot find a program it was promised. PATH is asserted by the
      # same loop: the daemon installs to a sbin directory, and that directory
      # being on this runner's PATH is assumed here and not verified anywhere
      # else.
      - name: Install test prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            openssh-server openssh-client
          for program in sshd ssh ssh-agent ssh-add ssh-keygen setsid \
            docker jq curl python3; do
            command -v "$program"
          done
          docker info --format 'Docker Engine {{.ServerVersion}}'

      # The log-collection test reads the runner's journal with journalctl, so
      # the journal must be persistent and readable by the runner user. Group
      # membership does not reach the running job, so an ACL grants access.
      - name: Make the journal persistent and readable
        run: |
          set -euo pipefail
          sudo mkdir -p /var/log/journal
          sudo systemd-tmpfiles --create --prefix /var/log/journal
          sudo systemctl restart systemd-journald
          sudo setfacl -R -m "u:$USER:rX" /var/log/journal
          sudo setfacl -R -d -m "u:$USER:rX" /var/log/journal

      # The images the log-collection test runs are pulled here, in a step of
      # their own, so a registry that cannot serve one fails this step by name
      # and never reads as a verdict on the log-collection rules; the test
      # pulls only an image that is still absent. The three images -- Alloy,
      # the fixture, and the Loki the test ships lines to -- are each asked of
      # the built tree rather than written out a second time here where they
      # could drift.
      - name: Pull log-collection test images
        run: |
          set -euo pipefail
          for what in image fixture-image loki-image; do
            docker pull "$(opam exec -- dune exec \
              ./test/alloy_real_docker/emit_config.exe -- "$what")"
          done

      # `just` alone runs the default recipe, the gate a commit has to pass
      # locally: build, test, fmt, lint and the server image check. The lint
      # recipes need the development tools, which the dependency install above
      # does not bring; this installs them from the package file itself.
      - name: Install lint prerequisites
        run: opam install . --deps-only --with-dev-setup -y

      # The tag is cut only after this step, so a version is never tagged on a
      # tree that fails any part of the gate.
      - name: Run the full gate
        run: just

      - uses: Homebrew/actions/setup-homebrew@1e34f2e2acaa766b7efacb8c26352e6abbb023f9 # 2026.09.13.1
      - name: Install Commitizen
        run: |
          brew install commitizen

      - name: Set release tag
        run: |
          set -euo pipefail
          NEXT_VERSION=$(just next-version)
          echo "RELEASE_VERSION=${NEXT_VERSION}" >> $GITHUB_ENV
          echo "RELEASE_TAG=v${NEXT_VERSION}" >> $GITHUB_ENV

      # Only the tag is pushed here. The GitHub release is created by the
      # release workflow the tag starts, after the server image for the same
      # version has been built, verified and pushed, so a release never exists
      # for an image that does not.
      #
      # A tag pushed with the default GITHUB_TOKEN starts no workflow at all
      # (assumed from documentation, not observed:
      # https://docs.github.com/en/actions/security-for-github-actions/security-guides/automatic-token-authentication#using-the-github_token-in-a-workflow),
      # and the tag is what starts the release workflow, so this push is made
      # with the PAT. It is bound under env for this step alone and is the only
      # place it is used.
      - name: Push the release tag
        env:
          PAT: ${{ secrets.PAT_GITHUB }}
        run: |
          set -euo pipefail
          git tag "$RELEASE_TAG"
          git push "https://x-access-token:${PAT}@github.com/${GITHUB_REPOSITORY}" "$RELEASE_TAG"
