name: commitizen

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - main

# Cancel any previous runs of this workflow for the same PR.
concurrency:
  group: commitizen-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  commitizen:
    runs-on: ubuntu-22.04
    if: "!github.event.pull_request.draft"

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: Homebrew/actions/setup-homebrew@1e34f2e2acaa766b7efacb8c26352e6abbb023f9 # 2026.09.13.1
      - name: Install Commitizen
        run: |
          brew install commitizen

      - name: Run Commitizen
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          COMMITS: ${{ github.event.pull_request.commits }}
        run: |
          cz check --rev-range "$HEAD_SHA~$COMMITS..$HEAD_SHA"
