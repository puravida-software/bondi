name: release-dry-run

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - main

# Cancel any previous runs of this workflow for the same PR.
concurrency:
  group: release-dry-run-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-cli:
    name: build-${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    if: "!github.event.pull_request.draft"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3.1.0
        with:
          just-version: "1.46.0"
      - uses: ./.github/actions/ocaml-deps

      - name: Build CLI
        run: |
          opam exec -- dune build @install
          opam exec -- dune install --prefix "$PWD/_build/install"

      - name: Package artifact
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          dist_dir="$PWD/dist"
          mkdir -p "$dist_dir"
          install -m 755 "_build/install/default/bin/bondi-client" "$dist_dir/bondi"
          tar -czf "bondi-${PLATFORM}.tar.gz" -C "$dist_dir" bondi

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bondi-${{ matrix.platform }}
          path: bondi-${{ matrix.platform }}.tar.gz

  build-server:
    name: build-server-image
    runs-on: ubuntu-22.04
    if: "!github.event.pull_request.draft"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3.1.0
        with:
          just-version: "1.46.0"
      - uses: Homebrew/actions/setup-homebrew@1e34f2e2acaa766b7efacb8c26352e6abbb023f9 # 2026.09.13.1
      - name: Install Commitizen
        run: brew install commitizen

      - name: Set version
        run: |
          set -euo pipefail
          VERSION=$(just next-version)
          if [ -z "$VERSION" ]; then
            echo "::error::just next-version returned empty"
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build server Docker image (dry run)
        run: just build-server "$VERSION"

      # The same three checks the release runs before pushing -- the two here
      # and the command-surface one below -- so a change that would publish an
      # image that cannot start, or whose subcommands disagree with its routes,
      # fails on the pull request rather than on a production host.
      - name: Verify the built image runs
        run: just verify-server-image latest

      - name: Verify that the check itself can fail
        run: just verify-server-image-negative latest

      # The command surface answers on the command line what the routes answer
      # over HTTP, asserted against the image rather than the build tree. This
      # runner is Docker Engine, which is the only engine the check accepts: a
      # rootless one reinterprets the group and user flags it exercises.
      - name: Check the image's command surface
        # As on the publishing path: the outbound-TLS assertion is opt-in in the
        # script, and the dry run turns it on so that it asserts what the real
        # release asserts rather than a subset of it.
        env:
          BONDI_CHECK_TLS_HANDSHAKE: "1"
        run: just check-server-image latest

  update-homebrew-tap-dry-run:
    name: update-homebrew-tap-dry-run
    runs-on: ubuntu-22.04
    needs: build-cli
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3.1.0
        with:
          just-version: "1.46.0"

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: ${{ runner.temp }}/release
          merge-multiple: true

      - name: Prepare formula copy
        run: |
          mkdir -p "$RUNNER_TEMP/tap/Formula"
          cp "packaging/homebrew/bondi.rb" "$RUNNER_TEMP/tap/Formula/bondi.rb"

      - uses: Homebrew/actions/setup-homebrew@1e34f2e2acaa766b7efacb8c26352e6abbb023f9 # 2026.09.13.1
      - name: Install Commitizen
        run: |
          brew install commitizen

      - name: Set version
        run: |
          set -euo pipefail
          VERSION=$(just next-version)
          if [ -z "$VERSION" ]; then
            echo "::error::just next-version returned empty; cannot update formula."
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Update formula (dry run)
        uses: ./.github/actions/update-homebrew-formula
        with:
          version: ${{ env.VERSION }}
          artifacts-path: ${{ runner.temp }}/release
          formula-path: ${{ runner.temp }}/tap/Formula/bondi.rb
          dry-run: "true"
          original-formula-path: packaging/homebrew/bondi.rb

      # The release rewrites the tap's formula, not the copy above, and the
      # updater refuses any layout it cannot read without guessing. So the dry
      # run also edits the tap's own formula: a pull request learns here, rather
      # than at release time, that the release would refuse it. The tap is
      # public, so the default token reads it; nothing here is pushed, and no
      # write credential reaches a pull request.
      - name: Checkout tap repository (read-only)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: puravida-software/homebrew-bondi
          path: homebrew-tap
          persist-credentials: false

      - name: Update the tap's formula (dry run)
        uses: ./.github/actions/update-homebrew-formula
        with:
          version: ${{ env.VERSION }}
          artifacts-path: ${{ runner.temp }}/release
          formula-path: homebrew-tap/Formula/bondi.rb
          dry-run: "true"
