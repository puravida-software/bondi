name: update-homebrew-formula
description: Update Homebrew formula with new version and checksums

inputs:
  version:
    description: 'Version to update in the formula'
    required: true
  artifacts-path:
    description: 'Path to directory containing the release artifacts'
    required: true
  formula-path:
    description: 'Path to the homebrew formula file'
    required: true
  dry-run:
    description: 'Whether to show diff instead of updating in place'
    required: false
    default: 'false'
  original-formula-path:
    description: 'Path to original formula file (for dry-run diff comparison)'
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - name: Calculate checksums
      shell: bash
      env:
        ARTIFACTS_PATH: ${{ inputs.artifacts-path }}
      run: |
        tarballs=("${ARTIFACTS_PATH}/bondi-linux-x86_64"*".tar.gz")
        if [ "${#tarballs[@]}" -ne 1 ] || [ ! -f "${tarballs[0]}" ]; then
          echo "::error::expected exactly one bondi-linux-x86_64 tarball in ${ARTIFACTS_PATH}, found: ${tarballs[*]}"
          exit 1
        fi
        export LINUX_SHA
        LINUX_SHA="$(sha256sum "${tarballs[0]}" | awk '{print $1}')"
        echo "LINUX_SHA=$LINUX_SHA" >> $GITHUB_ENV

    - name: Update formula
      shell: bash
      env:
        FORMULA_PATH: ${{ inputs.formula-path }}
        VERSION: ${{ inputs.version }}
      run: |
        if [ -z "${VERSION}" ]; then
          echo "::error::version input is empty; formula cannot be updated."
          exit 1
        fi
        python3 "$GITHUB_ACTION_PATH/update_formula.py" "$FORMULA_PATH" "$VERSION" "$LINUX_SHA"

    - name: Show formula diff
      if: inputs.dry-run == 'true' && inputs.original-formula-path != ''
      shell: bash
      env:
        FORMULA_PATH: ${{ inputs.formula-path }}
        ORIGINAL_FORMULA_PATH: ${{ inputs.original-formula-path }}
      run: |
        diff -u "$ORIGINAL_FORMULA_PATH" "$FORMULA_PATH" || true
