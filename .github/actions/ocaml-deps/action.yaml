name: ocaml-deps
description: Install OCaml dependencies

runs:
  using: "composite"

  steps:
    - uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6 # v3.9.1
      with:
        ocaml-compiler: 5.3.0
        dune-cache: true
        cache-prefix: v1

    - name: Install dependencies
      run: opam install -y --deps-only -t . -j 4
      shell: bash
